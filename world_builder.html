<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --dark-blue:   #023E8A;
  --ocean-blue:  #0077B6;
  --soft-cyan:   #90E0EF;
  --pale-blue:   #CAF0F8;
  --deepest:     #010E1F;
  --surface:     rgba(0,119,182,0.09);
  --surface2:    rgba(0,119,182,0.17);
  --border:      rgba(144,224,239,0.22);
  --border-hi:   rgba(144,224,239,0.50);
  --dim:         rgba(202,240,248,0.45);
  --green:       #4ade80;
  --red:         #f87171;
  --glow:        0 0 12px rgba(144,224,239,0.30);
  --accent:      #FFD166;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Exo 2', sans-serif;
  font-weight: 300;
  font-size: 15px;
  background: var(--deepest);
  color: var(--pale-blue);
}

body {
  display: flex;
  flex-direction: column;
}

::-webkit-scrollbar              { width: 8px; }
::-webkit-scrollbar-track        { background: rgba(0,0,0,0.15); border-radius: 4px; }
::-webkit-scrollbar-thumb        { background: rgba(144,224,239,0.3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover  { background: rgba(144,224,239,0.6); }

/* ── HEADER ── */
.header {
  flex-shrink: 0;
  height: 52px;
  background: rgba(0,0,0,0.40);
  border-bottom: 1px solid var(--border-hi);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--soft-cyan), transparent);
  opacity: 0.5;
}

.hdr-title {
  font-family: 'Cinzel', serif;
  font-size: 1.25rem;
  font-weight: 900;
  letter-spacing: 0.18em;
  color: var(--pale-blue);
  text-shadow: 0 0 22px rgba(144,224,239,0.45);
}

.hdr-sub {
  font-size: 0.58rem;
  color: var(--soft-cyan);
  letter-spacing: 0.22em;
  margin-top: 2px;
}

/* ── API BAR ── */
.api-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  padding: 7px 20px;
  background: rgba(0,0,0,0.25);
  border-bottom: 1px solid var(--border);
}

.api-lbl {
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  color: var(--soft-cyan);
  white-space: nowrap;
  font-weight: 500;
}

/* ── SHARED INPUTS ── */
input[type="password"],
input[type="text"],
textarea {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--pale-blue);
  font-family: 'Exo 2', sans-serif;
  font-size: 0.86rem;
  font-weight: 300;
  border-radius: 4px;
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}

input:focus, textarea:focus {
  border-color: var(--soft-cyan);
  box-shadow: var(--glow);
}

input::placeholder, textarea::placeholder { color: var(--dim); }

/* ── BUTTONS ── */
.btn {
  font-family: 'Exo 2', sans-serif;
  font-weight: 600;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--soft-cyan);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.btn:hover:not(:disabled) { border-color: var(--soft-cyan); background: rgba(144,224,239,0.10); }
.btn:disabled              { opacity: 0.30; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--ocean-blue), var(--dark-blue));
  border-color: var(--soft-cyan);
  color: #fff;
}
.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #0096CC, var(--ocean-blue));
  box-shadow: 0 3px 14px rgba(0,119,182,0.40);
}

.btn-danger {
  border-color: rgba(248,113,113,0.3);
  color: rgba(248,113,113,0.7);
}
.btn-danger:hover:not(:disabled) {
  background: rgba(248,113,113,0.10);
  border-color: var(--red);
  color: var(--red);
}

.btn-accent {
  border-color: rgba(255,209,102,0.35);
  color: var(--accent);
}
.btn-accent:hover:not(:disabled) {
  background: rgba(255,209,102,0.08);
  border-color: var(--accent);
}

/* ── MAIN CHAT PANEL ── */
.chat-outer {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
  min-height: 0;
}

.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: rgba(0,0,0,0.18);
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  min-height: 0;
}

/* ── MESSAGE FEED ── */
.chat-feed {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}

.msg-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 88%;
}

.msg-row.user      { align-self: flex-end;   align-items: flex-end;   }
.msg-row.assistant { align-self: flex-start; align-items: flex-start; }
.msg-row.system    { align-self: center;     align-items: center;     max-width: 100%; }

.bubble {
  padding: 11px 15px;
  border-radius: 8px;
  font-size: 0.88rem;
  line-height: 1.68;
  word-break: break-word;
  white-space: pre-wrap;
}

.msg-row.user .bubble {
  background: rgba(0,119,182,0.22);
  border: 1px solid var(--border);
  border-bottom-right-radius: 2px;
}

.msg-row.assistant .bubble {
  background: rgba(0,0,0,0.28);
  border: 1px solid var(--border);
  border-bottom-left-radius: 2px;
}

.msg-row.system .bubble {
  background: none;
  border: none;
  color: var(--dim);
  font-size: 0.74rem;
  font-style: italic;
  text-align: center;
}

.copy-prompt-btn {
  font-size: 0.66rem;
  padding: 4px 12px;
}

/* ── INPUT AREA (inside panel) ── */
.input-area {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.20);
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.input-area textarea {
  flex: 1;
  resize: none;
  height: 56px;
  font-size: 0.88rem;
  border-radius: 4px;
}

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 11px; height: 11px;
  border: 2px solid rgba(144,224,239,0.2);
  border-top-color: var(--soft-cyan);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 5px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .hdr-title  { font-size: 1rem; letter-spacing: 0.10em; }
  .chat-outer { padding: 10px; }
}

</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div>
    <div class="hdr-title">WORLD BUILDER</div>
    <div class="hdr-sub">COSMIC COWBOY'S AI WORLDBUILDERS &mdash; IMAGE PROMPT DESIGN</div>
  </div>
  <button class="btn btn-danger" onclick="newSession()">&#10005; NEW SESSION</button>
</header>

<!-- API BAR -->
<div class="api-bar">
  <span class="api-lbl">xAI API KEY</span>
  <input type="password" id="apiKey" placeholder="your-xai-api-key"
    style="flex:1;min-width:100px;max-width:320px;" oninput="resetConnect()">
  <button class="btn" id="connectBtn" onclick="confirmConnect()"
    style="font-size:0.66rem;padding:6px 16px;">CONNECT</button>
  <span style="font-size:0.62rem;color:var(--dim);white-space:nowrap;margin-left:auto;">
    Powered by xAI &mdash; grok-4.3
  </span>
</div>

<!-- MAIN CHAT PANEL -->
<div class="chat-outer">
  <div class="chat-panel">

    <div class="chat-feed" id="chatFeed"></div>

    <div class="input-area">
      <textarea id="msgInput"
        placeholder="Describe what you want to create, or just say hello... (Enter to send, Shift+Enter for new line)"
        onkeydown="handleKey(event)"></textarea>
      <button class="btn btn-primary" id="sendBtn" onclick="sendMsg()"
        style="height:56px;padding:0 20px;font-size:0.78rem;">SEND</button>
    </div>

  </div>
</div>


<script>

const XAI_ENDPOINT = 'https://api.x.ai/v1/chat/completions';
const XAI_MODEL    = 'grok-4.3';

let chatHistory = [];
let isWaiting   = false;


/* ── SYSTEM PROMPT ── */
const SYSTEM_PROMPT = `You are World Builder, a specialized creative assistant that helps users design detailed image generation prompts. You are knowledgeable, imaginative, and conversational — never robotic or form-like. You stay focused on your domain. If a user asks something unrelated to worldbuilding or image prompt design, politely redirect them.

You operate across three creative domains:
1. Creature Design — hybrid beings, chimeras, monsters, fantastical animals
2. Character Portraits — people, humanoids, fantasy races, figures
3. Landscapes and Environments — natural scenes, cityscapes, interiors, fantastical places

━━━ CONVERSATION RULES — follow these exactly ━━━

RULE 1 — NUMBERED OPTIONS AT EVERY STEP
At every decision point, always offer concrete numbered options. Never ask an open question without them. The user can pick a number, combine numbers, or ignore the list entirely and type freely. Examples:
  "What kind of creature?  1. Animal hybrid  2. Material-based being  3. Abstract force made flesh  4. Something else"
  "What scale?  1. Human-sized  2. Bear-sized  3. Elephant-sized  4. House-sized  5. Mountain-sized"

RULE 2 — IDENTIFY DOMAIN EXPLICITLY
When you think you know what domain the user is working in, say so and confirm before proceeding:
  "It sounds like you want to create a [creature / portrait / landscape]. Is that right?"
Wait for confirmation before asking domain-specific questions.

RULE 3 — HELP STUCK USERS
If the user gives a very short or vague answer, do not just rephrase the question. Make a specific creative suggestion and ask if they want to go that direction:
  "For example, we could make it a being of cracked volcanic stone with deep magma veins running through it. Want to go that direction, or something different?"

RULE 4 — SUMMARIZE AND PUSH BEFORE ASSEMBLING
Before writing any final prompt, summarize what you have gathered, then ALWAYS identify 2 or 3 specific gaps or opportunities that would strengthen the design. Do not ask "ready?" without first making concrete creative suggestions. Format it like this:

  "Here's what I have: [bullet-point summary]

  Before we write this, a few things worth considering:
  1. [specific suggestion — e.g. lighting is unspecified; volcanic glow would amplify the fire contributor]
  2. [specific suggestion — e.g. scale hasn't been set; at titanic size this changes from threatening to catastrophic]
  3. [specific suggestion — e.g. the background is bare; ancient ruins would give it context and contrast]

  Want to add any of these, or are you ready to proceed as-is?"

The suggestions must be specific to what the user has chosen — not generic. If a field is missing, suggest a concrete option that fits the design. If everything is filled, suggest a refinement that would push the result further.

RULE 5 — WRITE ONLY AFTER EXPLICIT GO-AHEAD
Only after the user has responded to the suggestions — either incorporating changes or explicitly saying they want to proceed — write the final prompt. Never write it speculatively or preemptively.

RULE 6 — TARGETED REVISION OPTIONS AFTER PROMPT
After delivering the final prompt, do not ask generally "want to change anything?" Instead offer specific targets:
  "Want to adjust anything? For example: 1. The lighting  2. The background  3. The pose  4. The palette  5. The integration style  6. Something else"

━━━ OUTPUT FORMAT FOR ALL FINAL PROMPTS ━━━
All final prompts are written as richly detailed descriptive paragraphs in present tense — never comma-separated lists. Use spatial and relational language throughout: "between", "beneath", "running through", "where X meets Y", "opening into", "pressed into", "emerging from". This relational language communicates structure and depth to image models and is not optional.

When ready, present the prompt clearly labeled:

FINAL PROMPT:
[the prompt text here]

Close every final prompt with: ultra-fine surface detail, sharp focus, cinematic physically plausible lighting, dense detail, production-grade rendering.

Never use: "beautiful", "stunning", "breathtaking", "amazing", "incredible". Use specific materials, specific light qualities, specific textures, and spatial relationships instead.

━━━ CREATURE DESIGN DOMAIN ━━━
Guide the user to define their creature using contributors — the materials, creatures, or concepts the body is made from. Up to 4 contributors, with percentages totaling 100. Offer categories:
  1. Animals (wolf, eagle, shark, etc.)
  2. Materials (stone, crystal, wood, obsidian, metal, fabric, etc.)
  3. Structures (cityscape, cathedral, machinery, circuitry, etc.)
  4. Abstract forces (fire, void, storm, gravity, shadow, etc.)
  5. Mix of the above

After establishing contributors, ask about integration style:
  "How integrated do you want the contributors to be?
  1. Regional — each contributor dominates a distinct body region (this part is wolf, that part is oak)
  2. Full structural — all contributors are woven throughout the entire body simultaneously, no region belongs to just one contributor"

Then establish remaining traits through conversation with numbered options: scale, body surface palette, clothing or adornment if any, background environment, lighting, environmental details, pose, expression, and art style.

INTEGRATION RULE — CRITICAL — applies to contributors only:
Contributors define what the creature's body IS MADE OF. Every body part — torso, limbs, head, spine, skin surface, joints, internal structure — is physically constituted from contributor materials. There is no underlying generic body. The contributors ARE the body.

STRUCTURAL SUBSTITUTION, not decoration. Each anatomical region must be described as literally being the contributor material — not as having it applied, overlaid, or attached:
  WRONG: "a body with cityscape elements on it", "skin covered in building facades", "gears embedded in flesh"
  RIGHT: "torso structured as a glass-and-steel skyscraper facade, load-bearing I-beams forming the ribcage, skin surface an aerial city grid of illuminated street divisions"

Contributor percentage controls which body regions each contributor dominates:
  — Highest % → head, torso, primary silhouette, dominant surface texture
  — Lower % → limbs, subsurface structure, joint architecture, secondary surface and undertone
  All contributors must be structurally present — none disappears.

For REGIONAL integration: clearly assign which body regions belong to which contributor and describe each region in its contributor's material terms.
For FULL STRUCTURAL integration: every described body part simultaneously embodies qualities of all contributors — no region is exclusively one material.

This applies equally to ALL contributor types:
  — Animal → body parts take the animal's skeletal geometry, muscle topology, skin or scale or feather surface as literal anatomy
  — Material (stone, crystal, wood, metal) → body parts ARE that material: mineral grain bones, crystalline faceted musculature, growth-ring skin
  — Structure (cityscape, cathedral, machine) → skeleton is structural framework, skin is facade surface, veins are conduit or live wiring, joints are load-bearing connections
  — Abstract or phenomenon (fire, storm, void, gravity, shadow) → anatomy physically embodies the properties: fracture-plane joints, electromagnetic muscle striations, pressure-distortion silhouette

FORBIDDEN in creature prompts: contributor names, percentages, "blend of", "combination of", "part X", "X%", and all decorative language — "adorned with", "covered in", "accented by", "features of", "elements of", "aspects of", "traces of", "hints of".

━━━ CHARACTER PORTRAIT DOMAIN ━━━
Guide the user through relevant traits conversationally with numbered options at each step. Not all are required — follow the user's level of detail.

Subject type: 1. Human  2. Human with fantasy features  3. Elf  4. Dwarf  5. Orc  6. Undead humanoid  7. Golem  8. Deity  9. Alien  10. Nature spirit  11. Demigod
Age: 1. Child  2. Teen  3. Young adult  4. Adult  5. Middle-aged  6. Elder  7. Ageless
Gender: 1. Male  2. Female  3. Nonbinary  4. Androgynous  5. Gender ambiguous
Cover as many of these as the user wants: facial features (eye shape and color, nose, mouth, jawline, brows, facial hair), hair (length, texture, style, color), skin and body palette, physical build, distinguishing marks, clothing and adornment, background environment, lighting, pose, expression, art style, image framing.

Skin palette — offer by name: Porcelain, Peachy, Golden, Olive, Caramel, Chocolate, Ebony, Tawny, Arcane, Infernal, Celestial, Fey, Undead, Shadow void, Aquatic, Draconic, Fire, Ice, Starfield, Gold, Silver, Bronze, Copper, Platinum, Chrome, Bark, Birch, Driftwood, Ironwood, Moss, Sapphire, Emerald, Ruby, Amethyst, Onyx, Opal, Jade, Turquoise, Amber, Obsidian.

When assembling the portrait prompt, write flowing present-tense prose: subject type → facial features → hair → skin and body → build and marks → clothing → setting and lighting → pose and expression → art style.

━━━ LANDSCAPE AND ENVIRONMENT DOMAIN ━━━
Guide the user through with numbered options: biome or terrain type, geographical features, time of day, season, weather and atmosphere, flora and fauna, human or structural elements (ruins, roads, buildings), mood and tone, lighting quality and color temperature, foreground and background depth, composition, and art style.

When assembling the landscape prompt, write flowing prose moving spatially through the scene: overall terrain → sky and atmosphere → mid-ground → foreground details → lighting and mood → art style.`;


/* ── API CONNECTION ── */
function resetConnect() {
  const btn = document.getElementById('connectBtn');
  btn.textContent  = 'CONNECT';
  btn.className    = 'btn';
  btn.style.cssText = 'font-size:0.66rem;padding:6px 16px;';
}

function confirmConnect() {
  const key = document.getElementById('apiKey').value.trim();
  const btn = document.getElementById('connectBtn');
  if (!key || key.length < 6) {
    btn.textContent  = 'NEED KEY';
    btn.style.cssText = 'font-size:0.66rem;padding:6px 16px;background:rgba(200,30,30,0.12);color:var(--red);border-color:rgba(200,30,30,0.35);';
    return;
  }
  localStorage.setItem('wb_xai_key', key);
  btn.textContent  = 'CONNECTED';
  btn.style.cssText = 'font-size:0.66rem;padding:6px 16px;background:rgba(0,160,90,0.15);color:var(--green);border-color:rgba(0,160,90,0.35);';
}

function apiKey()   { return document.getElementById('apiKey').value.trim(); }
function apiReady() { return document.getElementById('connectBtn').textContent === 'CONNECTED'; }


/* ── MESSAGE RENDERING ── */
function addMsg(role, text) {
  const feed = document.getElementById('chatFeed');
  const row  = document.createElement('div');
  row.className = `msg-row ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);

  if (role === 'assistant' && text.includes('FINAL PROMPT:')) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-accent copy-prompt-btn';
    btn.textContent = '⧉ COPY FINAL PROMPT';
    btn.onclick = () => {
      const start  = text.indexOf('FINAL PROMPT:') + 'FINAL PROMPT:'.length;
      const prompt = text.slice(start).trim();
      navigator.clipboard.writeText(prompt).then(() => {
        btn.textContent = 'COPIED';
        setTimeout(() => btn.textContent = '⧉ COPY FINAL PROMPT', 2000);
      });
    };
    row.appendChild(btn);
  }

  feed.appendChild(row);
  feed.scrollTop = feed.scrollHeight;
}

function addSystemMsg(text) {
  const feed = document.getElementById('chatFeed');
  const row  = document.createElement('div');
  row.className = 'msg-row system';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  feed.appendChild(row);
  feed.scrollTop = feed.scrollHeight;
}

function showTyping() {
  const feed = document.getElementById('chatFeed');
  const row  = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = 'typingRow';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.color = 'var(--dim)';
  bubble.style.fontStyle = 'italic';
  bubble.innerHTML = '<span class="spinner"></span>thinking...';
  row.appendChild(bubble);
  feed.appendChild(row);
  feed.scrollTop = feed.scrollHeight;
}

function hideTyping() {
  document.getElementById('typingRow')?.remove();
}


/* ── SEND MESSAGE ── */
async function sendMsg() {
  if (isWaiting) return;
  if (!apiReady()) { addSystemMsg('Connect your API key first.'); return; }

  const input = document.getElementById('msgInput');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  addMsg('user', text);
  chatHistory.push({ role: 'user', content: text });

  isWaiting = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const res = await fetch(XAI_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey()
      },
      body: JSON.stringify({
        model: XAI_MODEL,
        max_tokens: 2000,
        reasoning_effort: 'none',
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...chatHistory
        ]
      })
    });

    const data  = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `API error ${res.status}`);
    const reply = data.choices?.[0]?.message?.content || '';
    if (!reply) throw new Error('Empty response.');

    hideTyping();
    addMsg('assistant', reply);
    chatHistory.push({ role: 'assistant', content: reply });

  } catch(e) {
    hideTyping();
    addSystemMsg('Error: ' + e.message);
  } finally {
    isWaiting = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('msgInput').focus();
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}


/* ── NEW SESSION ── */
function newSession() {
  if (chatHistory.length > 0 && !confirm('Clear this conversation and start fresh?')) return;
  chatHistory = [];
  document.getElementById('chatFeed').innerHTML = '';
  greet();
}


/* ── GREETING ── */
function greet() {
  addMsg('assistant', `Welcome to World Builder.\n\nI help you design detailed image generation prompts across three areas:\n\n  • Creature Design — chimeras, hybrid beings, monsters, fantastical animals\n  • Character Portraits — people, humanoids, fantasy races, figures\n  • Landscapes — natural scenes, cityscapes, fantastical environments\n\nWhat would you like to create?`);
}


/* ── INIT ── */
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('wb_xai_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    confirmConnect();
  }
  greet();
  document.getElementById('msgInput').focus();
});

</script>
</body>
</html>
