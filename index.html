<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Cowboy's AI Worldbuilders</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --deepest:    #010E1F;
  --ocean-blue: #0077B6;
  --soft-cyan:  #90E0EF;
  --pale-blue:  #CAF0F8;
  --accent:     #FFD166;
  --surface:    rgba(0,119,182,0.09);
  --surface2:   rgba(0,119,182,0.17);
  --border:     rgba(144,224,239,0.22);
  --border-hi:  rgba(144,224,239,0.50);
  --dim:        rgba(202,240,248,0.45);
  --green:      #4ade80;
  --red:        #f87171;
  --glow:       0 0 20px rgba(144,224,239,0.25);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'Exo 2', sans-serif; font-weight: 300; font-size: 15px; background: var(--deepest); color: var(--pale-blue); }
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
::-webkit-scrollbar-thumb { background: rgba(144,224,239,0.28); border-radius: 4px; }

.header {
  text-align: center;
  padding: 56px 24px 36px;
  position: relative;
  border-bottom: 1px solid var(--border);
}
.header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--soft-cyan), transparent);
}
.brand { font-size: 0.70rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--soft-cyan); margin-bottom: 14px; }
.title { font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; letter-spacing: 0.08em; color: var(--pale-blue); text-shadow: 0 0 40px rgba(144,224,239,0.35); margin-bottom: 12px; line-height: 1.15; }
.subtitle { font-size: 0.85rem; color: var(--dim); letter-spacing: 0.06em; max-width: 520px; margin: 0 auto; line-height: 1.7; }

.toolbar {
  max-width: 1100px;
  margin: 32px auto 0;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.toolbar-label { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--soft-cyan); }
.toolbar-right { display: flex; gap: 8px; }
.add-btn {
  background: rgba(255,209,102,0.10);
  border: 1px solid rgba(255,209,102,0.35);
  color: var(--accent);
  font-family: 'Exo 2', sans-serif;
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.10em;
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.15s;
}
.add-btn:hover { background: rgba(255,209,102,0.20); }
.reset-btn {
  background: rgba(144,224,239,0.06);
  border: 1px solid var(--border);
  color: var(--dim);
  font-family: 'Exo 2', sans-serif;
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.10em;
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
}
.reset-btn:hover { color: var(--pale-blue); border-color: var(--border-hi); background: var(--surface2); }

.grid-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 24px 64px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

.card-wrap {
  position: relative;
  cursor: grab;
}
.card-wrap.dragging { opacity: 0.40; cursor: grabbing; }
.card-wrap.drag-over .card { border-color: var(--soft-cyan); box-shadow: var(--glow); }

.card {
  display: block;
  text-decoration: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 18px 20px 14px;
  transition: background 0.16s, border-color 0.16s, box-shadow 0.16s, transform 0.16s;
  position: relative;
  overflow: hidden;
  height: 100%;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--ocean-blue), var(--soft-cyan));
  opacity: 0;
  transition: opacity 0.16s;
}
.card:hover { background: var(--surface2); border-color: var(--border-hi); box-shadow: var(--glow); transform: translateY(-2px); }
.card:hover::before { opacity: 1; }

.card-icon { font-size: 1.5rem; margin-bottom: 8px; display: block; }
.card-title { font-family: 'Cinzel', serif; font-size: 0.84rem; font-weight: 700; letter-spacing: 0.10em; color: var(--pale-blue); margin-bottom: 5px; text-transform: uppercase; }
.card-desc { font-size: 0.76rem; color: var(--dim); line-height: 1.6; }

.delete-btn {
  position: absolute;
  top: 7px; right: 7px;
  background: none;
  border: 1px solid rgba(248,113,113,0.28);
  color: rgba(248,113,113,0.45);
  font-size: 0.68rem;
  width: 20px; height: 20px;
  border-radius: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.14s;
  line-height: 1;
  z-index: 2;
}
.delete-btn:hover { background: rgba(248,113,113,0.15); color: var(--red); border-color: var(--red); }

.drag-handle {
  position: absolute;
  bottom: 8px; right: 8px;
  color: rgba(144,224,239,0.25);
  font-size: 0.75rem;
  line-height: 1;
  cursor: grab;
  user-select: none;
}

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--dim);
  font-size: 0.85rem;
  line-height: 1.8;
  border: 1px dashed var(--border);
  border-radius: 5px;
}
.empty-state strong { color: var(--soft-cyan); font-weight: 600; display: block; margin-bottom: 8px; font-family: 'Cinzel', serif; font-size: 0.90rem; letter-spacing: 0.10em; }

/* MODAL */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-bg.show { display: flex; }
.modal {
  background: #010E1F;
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  padding: 28px;
  width: 100%;
  max-width: 440px;
  position: relative;
}
.modal-title {
  font-family: 'Cinzel', serif;
  font-size: 0.84rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--pale-blue);
  margin-bottom: 22px;
}
.modal label {
  display: block;
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--soft-cyan);
  margin-bottom: 5px;
  margin-top: 14px;
}
.modal label:first-of-type { margin-top: 0; }
.modal input {
  width: 100%;
  background: rgba(0,0,0,0.40);
  border: 1px solid var(--border);
  color: var(--pale-blue);
  font-family: 'Exo 2', sans-serif;
  font-size: 0.85rem;
  padding: 7px 10px;
  border-radius: 3px;
  outline: none;
  transition: border-color 0.2s;
}
.modal input:focus { border-color: var(--soft-cyan); }
.modal-hint { font-size: 0.70rem; color: var(--dim); margin-top: 4px; }
.modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }
.btn-cancel {
  background: rgba(0,0,0,0.30);
  border: 1px solid var(--border);
  color: var(--dim);
  font-family: 'Exo 2', sans-serif;
  font-size: 0.76rem;
  padding: 7px 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.14s;
}
.btn-cancel:hover { color: var(--pale-blue); background: var(--surface2); }
.btn-save {
  background: linear-gradient(135deg, var(--ocean-blue), rgba(0,119,182,0.65));
  border: 1px solid var(--soft-cyan);
  color: var(--pale-blue);
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.10em;
  padding: 7px 18px;
  border-radius: 3px;
  cursor: pointer;
  text-transform: uppercase;
  transition: box-shadow 0.2s;
}
.btn-save:hover { box-shadow: 0 0 12px rgba(144,224,239,0.35); }

footer { text-align: center; padding: 18px; font-size: 0.70rem; color: var(--dim); border-top: 1px solid var(--border); letter-spacing: 0.08em; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">Cosmic Cowboy's AI Worldbuilders</div>
  <h1 class="title">THE GENERATOR SUITE</h1>
  <p class="subtitle">Structured prompt builders for AI image and video generation.</p>
</div>

<div class="toolbar">
  <span class="toolbar-label">Generators</span>
  <div class="toolbar-right">
    <button class="reset-btn" onclick="resetToDefaults()">Reset to Defaults</button>
    <button class="add-btn" onclick="openModal()">+ Add Generator</button>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-title">Add Generator</div>
    <label>Name</label>
    <input type="text" id="inName" placeholder="Chimera Generator">
    <label>Description</label>
    <input type="text" id="inDesc" placeholder="Brief description of what it does">
    <label>Icon</label>
    <input type="text" id="inIcon" placeholder="🧬">
    <div class="modal-hint">Paste any emoji</div>
    <label>Filename</label>
    <input type="text" id="inFile" placeholder="chimera_generator.html">
    <div class="modal-hint">Just the filename, no path needed</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Add</button>
    </div>
  </div>
</div>

<footer>Cosmic Cowboy's AI Worldbuilders &mdash; All generators produce original creative prompts only</footer>

<script>
const STORE = 'cc_hub_v1';

const DEFAULTS = [
  { name: 'Landscape Generator',       icon: '🏔️', file: 'landscape_generator.html',       desc: 'Terrain, biome, atmosphere, and lighting for environment scenes.' },
  { name: 'Cityscape Generator',       icon: '🏙️', file: 'cityscape_generator.html',       desc: 'Urban skylines, street level, architectural styles, and era.' },
  { name: 'Vehicle Generator',         icon: '🚗', file: 'vehicle_generator.html',         desc: 'Ground, air, sea, and space vehicles across any domain and era.' },
  { name: 'Spaceship Generator',       icon: '🚀', file: 'spaceship_generator.html',       desc: 'Spacecraft with exterior and interior modes and full customization.' },
  { name: 'Space Station Generator',   icon: '🛸', file: 'space_station_generator.html',   desc: 'Space stations with 9 presets, exterior and interior toggle.' },
  { name: 'Robotics & Mech Generator', icon: '🤖', file: 'robotics_or_mech_generator.html', desc: 'Robots, mechs, and mechanical constructs with contributor mixing.' },
  { name: 'Steampunk Generator',       icon: '⚙️', file: 'steampunk_generator.html',       desc: 'Steampunk scenes, characters, and contraptions with contributor mixing.' },
  { name: 'Chimera Generator',         icon: '🧬', file: 'chimera_generator.html',         desc: 'Multi-contributor creature synthesis with full biological integration.' },
  { name: 'Fantasy Items Generator',   icon: '⚔️', file: 'fantasy_items_generator.html',   desc: 'Weapons, armor, and magical artifacts with stats and lore.' },
  { name: 'D&D Character Generator',   icon: '🎲', file: 'dnd_character_generator.html',   desc: 'Mechanically viable D&D characters with stats, lore, and portrait prompt.' },
  { name: 'Portrait Generator',        icon: '👤', file: 'portrait_generator.html',        desc: 'Detailed portrait prompts — facial features, skin, hair, clothing, setting.' },
  { name: 'Pattern Tile Generator',    icon: '◈',  file: 'pattern_tile_generator.html',    desc: 'Seamless tileable patterns across 7 categories including fractal and biological.' },
];

let entries = [];
let dragSrc = null;

function load() {
  const raw = localStorage.getItem(STORE);
  entries = raw ? JSON.parse(raw) : [...DEFAULTS];
  render();
}

function save() {
  localStorage.setItem(STORE, JSON.stringify(entries));
}

function resetToDefaults() {
  if (!confirm('Reset the grid to the default generator list? Any custom entries or reordering will be lost.')) return;
  entries = [...DEFAULTS];
  save();
  render();
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (entries.length === 0) {
    grid.innerHTML = `<div class="empty-state"><strong>No Generators Yet</strong>Click "Add Generator" to add your first one.</div>`;
    return;
  }

  entries.forEach((e, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.draggable = true;
    wrap.dataset.index = i;

    wrap.innerHTML = `
      <a class="card" href="${esc(e.file)}" target="_blank">
        <button class="delete-btn" onclick="deleteEntry(event, ${i})">x</button>
        <span class="card-icon">${esc(e.icon || '📄')}</span>
        <div class="card-title">${esc(e.name)}</div>
        <div class="card-desc">${esc(e.desc || '')}</div>
        <span class="drag-handle">&#8801;</span>
      </a>`;

    wrap.addEventListener('dragstart', onDragStart);
    wrap.addEventListener('dragover',  onDragOver);
    wrap.addEventListener('dragleave', onDragLeave);
    wrap.addEventListener('drop',      onDrop);
    wrap.addEventListener('dragend',   onDragEnd);

    grid.appendChild(wrap);
  });
}

function deleteEntry(e, i) {
  e.preventDefault();
  e.stopPropagation();
  if (!confirm('Remove this generator from the list?')) return;
  entries.splice(i, 1);
  save();
  render();
}

/* MODAL */
function openModal() {
  document.getElementById('inName').value = '';
  document.getElementById('inDesc').value = '';
  document.getElementById('inIcon').value = '';
  document.getElementById('inFile').value = '';
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('inName').focus();
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
}

function saveEntry() {
  const name = document.getElementById('inName').value.trim();
  const desc = document.getElementById('inDesc').value.trim();
  const icon = document.getElementById('inIcon').value.trim();
  const file = document.getElementById('inFile').value.trim();
  if (!name || !file) { alert('Name and filename are required.'); return; }
  entries.push({ name, desc, icon: icon || '📄', file });
  save();
  render();
  closeModal();
}

/* DRAG TO REORDER */
function onDragStart(e) {
  dragSrc = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (this !== dragSrc) this.classList.add('drag-over');
}

function onDragLeave() {
  this.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  this.classList.remove('drag-over');
  if (this === dragSrc) return;
  const from = parseInt(dragSrc.dataset.index);
  const to   = parseInt(this.dataset.index);
  const moved = entries.splice(from, 1)[0];
  entries.splice(to, 0, moved);
  save();
  render();
}

function onDragEnd() {
  document.querySelectorAll('.card-wrap').forEach(w => {
    w.classList.remove('dragging', 'drag-over');
  });
}

/* CLOSE MODAL ON BG CLICK */
document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ENTER / ESC IN MODAL */
document.getElementById('modalBg').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveEntry();
  if (e.key === 'Escape') closeModal();
});

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

load();
</script>
</body>
</html>
